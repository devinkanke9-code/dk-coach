h1 { margin: 0; font-size: clamp(24px, 7vw, 30px); line-height: 1.1; letter-spacing: .01em; text-wrap: balance; }

.devin-foto { position: absolute; z-index: 4; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(30%, 128px); aspect-ratio: 3 / 4; padding: 0;
  border-radius: 14px; overflow: hidden; cursor: pointer; border: 1px solid rgba(194, 156, 94, .75); background: #14171c; box-shadow: 0 6px 22px rgba(0, 0, 0, .5); }

.steuer { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 8px; }
