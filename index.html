<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DK Coach</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DK Coach">
<!-- manifest setzt app.js (nicht auf dem iPhone: dort soll „Zum Home-Bildschirm“ den Link mit dem Plan behalten) -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<!-- Design wie die Trainer-Seite: stil.css kommt aus app/src (build.js kopiert es), buehne.css = 3D-Bühne für beide -->
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="stil.css">
<link rel="stylesheet" href="buehne.css">
<style>
/* Nur Kunden-App: Rahmen ohne claude.ai (dort setzt die Plattform diese Grundwerte) */
html, body { margin: 0; padding: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.kopf .rechts { max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.willkommen { justify-items: center; text-align: center; padding: 28px 18px; }
.willkommen .logo { width: 84px; height: 84px; border-radius: 20px; }
/* Code-Eingabe und Analyse (seit 29.10.2026) */
.code-feld { width: 100%; max-width: 280px; font-size: 30px; text-align: center; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
.willkommen .einfuegen, .willkommen .einfuegen textarea { width: 100%; }
.analyse .frage { grid-template-columns: 1fr; gap: 8px; }
.analyse .janein span { min-width: 84px; padding: 10px 0; }
.analyse .frage-gross { font-size: 24px; line-height: 1.2; margin-bottom: 4px; }
.analyse .versteckt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <header class="kopf"><div class="kopf-innen">
    <div class="marke">DK COACH<small>Dein Training</small></div>
    <div class="rechts" id="wer"></div>
  </div></header>
  <main><div class="inhalt" id="ansicht"><p class="leise">Lädt …</p></div></main>
  <nav class="leiste" aria-label="Bereiche" hidden><div id="leiste"></div></nav>
</div>
<noscript><p style="padding:16px">DK Coach braucht JavaScript.</p></noscript>
<script src="kompakt.js" defer></script>
<script src="antippen.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
