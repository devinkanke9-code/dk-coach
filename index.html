.code-feld { width: 100%; max-width: 320px; font-size: 24px; text-align: center; letter-spacing: .08em; font-variant-numeric: tabular-nums; }   /* 12 Ziffern + 2 Striche (13.11.2026) */

.st-block.st-ueber { padding-bottom: 48px; }
.st-ueber-text { display: grid; justify-items: center; gap: 16px; max-width: 560px; }
.st-ueber-text .logo { width: 64px; height: 64px; border-radius: 16px; }

.umzug .knopf { justify-self: start; }

.kopf .st-nav::before { inset: -7px -6px; }

.tm.still .tm-in > * { animation: none; }   /* Schmerz-Skala: ein Tipp auf eine Zahl blendete die ganze Ansicht neu ein (Gesamttest 13.11.2026) */
.aktionen { gap: 12px; }   /* Gesamttest 13.11.2026: „Training starten“ und „Ins Gym gehen“ standen 8 px auseinander, der 6-px-Rand des einen reichte über die Mitte */
/* Nachbesserung 14.11.2026 (nur Kunden-App, buehne.css gilt auch für die Trainer-Seite):
   Rang-Wappen: Zahl mit mindestens 4,5:1 gegen beide Enden des Verlaufs. Dunkle Metalle (1–5) weiße Zahl, das helle Ende etwas dunkler;

.rang-wappen.t1 { --a: #6c7585; } .rang-wappen.t2 { --a: #a06a3b; } .rang-wappen.t3 { --a: #6c747e; } .rang-wappen.t4 { --a: #5a7790; --b: #455d73; } .rang-wappen.t5 { --a: #5d7886; }
.rang-wappen.t9 { --b: #4291dc; } .rang-wappen.t10 { --b: #e6508c; }
.rang-wappen:is(.t6, .t7, .t8, .t9, .t10) { color: #16181d; }

.erklaer-knopf { min-height: 44px; }
/* Live-Gym (Nachbesserung 14.11.2026): Bis 520 px lag „PR-Raum“ unten rechts auf dem großen Knopf und dem Hilfetext (mit Maus), bei 320 px

@media (max-width: 520px) { .raum.live .raum-pr-knopf { top: calc(124px + env(safe-area-inset-top, 0px)); bottom: auto; } }
@media (hover: hover) and (pointer: fine) and (max-width: 520px) { .raum.live .raum-tipp { bottom: calc(232px + env(safe-area-inset-bottom, 0px)); } }
@media (hover: hover) and (pointer: fine) and (min-width: 1101px) { .raum.live .raum-unten { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); } .raum.live .raum-tipp { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }
body.start .umzug { grid-column: 1 / -1; margin: 12px 12px 0; }
/* Wie eine App (07.11.2026, Devin: „dass du nichts markieren kannst“, „dass man nicht reinzoomen kann“): kein Markieren außer in Feldern, kein Doppeltipp-Zoom */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

.code-leiste { display: grid; gap: 6px; }

}

/* Feinschliff (10.11.2026, Devin: „professionell Design … wie eine App, die man täglich benutzen kann und es nächsten Tag benutzen will“).
   Nur Kunden-App. Kopf mit Gruß, Wochenkarte, Fortschritt, ruhige Übungszeilen, Technik-Tipp, Ruhetag, Plan-Werte in vier Spalten. Farben nur aus den Farbwelten. */
.plan-kopf.gruss { gap: 2px; }
.plan-kopf.gruss h1 { text-wrap: balance; }
.plan-kopf.gruss .meldung { margin-top: 10px; }
.woche-karte { gap: 14px; }
.woche-kopf { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; }
.woche-kopf p { grid-column: 1 / -1; text-wrap: pretty; }
.woche-kopf .knopf { margin-right: -8px; }
.woche-karte .wochenleiste .wt { min-height: 70px; background: none; border-color: transparent; box-shadow: none; }
.woche-karte .wochenleiste .wt.heute { border-color: var(--akzent); }

.woche-stand { display: flex; align-items: center; gap: 12px; }
.woche-ring { position: relative; flex: 0 0 auto; width: 46px; height: 46px; display: grid; place-items: center; }
.woche-ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--akzent-hell) calc(var(--p, 0) * 1%), color-mix(in srgb, currentColor 14%, transparent) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4.5px)); }

.block.heute .ueb-liste { gap: 0; }

/* Glas (16.11.2026, Devin: „Glow-Glass-Effekt wie bei Apple … dass die Buttons auch richtig geil aussehen“; dann: „dass man komplett durchgucken kann …
   nicht verschwommen … wie bei einer Brille … ein bisschen verschoben … er vergrößert“). Nur Kunden-App.
   Karten sind klares Glas: glas.js legt in jede Karte das Wellenbild der Seite, scharf und leicht vergrößert (wie durch eine Brille), mit heller Kante und Schatten.
   Ein dünner Farbton und ein feiner Schriftschatten halten den Text lesbar. Kopf und Leiste unten bleiben weichgezeichnet, weil dort Text darunter durchläuft.
   Hauptknopf mit Glanz oben und Schein in der Akzentfarbe, die anderen Knöpfe als Glas-Pille; der Glanz liegt nur im oberen Drittel, hinter der Schrift bleibt die alte Farbe.
   Ohne glas.js, in der Farbwelt Klar, in Blättern, Training und Gym und mit „Transparenz reduzieren“ bleiben die Karten dicht wie bisher. */
:root { --g-ton: rgba(255, 255, 255, .15); --g-ton2: rgba(255, 255, 255, .03); --g-kante: rgba(255, 255, 255, .95); --g-rand: rgba(255, 255, 255, .7); --g-tief: rgba(10, 60, 90, .14); --g-saum: rgba(255, 255, 255, .62);
  --g-schatten: 0 26px 50px -26px rgba(10, 60, 90, .6), 0 3px 8px rgba(10, 60, 90, .1); --g-schein: rgba(10, 116, 176, .5); --g-glanz: rgba(255, 255, 255, .55); --g-schrift: 0 0 3px rgba(255, 255, 255, .95), 0 1px 2px rgba(255, 255, 255, .85); --g-bild: url(wellen-hell.jpg); }
:root[data-look="gold"] { --g-ton: rgba(12, 12, 16, .22); --g-ton2: rgba(12, 12, 16, .06); --g-kante: rgba(255, 240, 205, .5); --g-rand: rgba(236, 200, 110, .3); --g-tief: rgba(0, 0, 0, .45); --g-saum: rgba(255, 236, 190, .17);
  --g-schatten: 0 28px 54px -24px rgba(0, 0, 0, .9), 0 3px 8px rgba(0, 0, 0, .35); --g-schein: rgba(220, 180, 83, .5); --g-glanz: rgba(255, 255, 255, .12); --g-schrift: 0 0 4px rgba(0, 0, 0, .9), 0 1px 3px rgba(0, 0, 0, .85); --g-bild: url(wellen-dunkel.jpg); }
:root[data-look="klar"] { --g-kante: #fff; --g-rand: rgba(0, 0, 0, .07); --g-tief: rgba(0, 0, 0, .05); --g-schein: rgba(0, 113, 227, .42); --g-glanz: rgba(255, 255, 255, .6); }
html.dk-wellen-an .g-glas { --g-r: 26px; position: relative; isolation: isolate; border: 1px solid var(--g-rand); border-radius: var(--g-r); text-shadow: var(--g-schrift);
  box-shadow: inset 0 1px 0 var(--g-kante), inset 0 -1px 0 var(--g-tief), inset 0 0 26px var(--g-saum), var(--g-schatten); }
html.dk-wellen-an .rang-kurz.g-glas { --g-r: 20px; }
html.dk-wellen-an .g-glas .knopf, html.dk-wellen-an .g-glas input, html.dk-wellen-an .g-glas textarea, html.dk-wellen-an .g-glas .wt, html.dk-wellen-an .g-glas .block { text-shadow: none; }
/* Glas stärker (16.11.2026, Devin: „Noch stärker“): Vergrößerung 1,34 statt 1,16, Farbton auf den Karten halbiert, dafür kräftigerer Schriftschatten. */
.g-linse { display: none; }
html.dk-wellen-an .g-glas > .g-linse { display: block; position: absolute; inset: 0; z-index: -1; border-radius: inherit; -webkit-clip-path: inset(0 round var(--g-r)); clip-path: inset(0 round var(--g-r)); pointer-events: none; }
html.dk-wellen-an .g-glas.g-fern > .g-linse { display: none; }
.g-linse i { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100lvh; background: var(--g-bild) center / cover no-repeat; transform: scale(1.34); transform-origin: 50% 50%; }
.g-linse > i { transform: scale(2); filter: brightness(1.14) saturate(1.3); }
