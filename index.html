<!-- Design wie die Trainer-Seite: stil.css kommt aus app/src (build.js kopiert es), buehne.css = 3D-Bühne für beide -->
<link rel="stylesheet" href="schriften/schriften.css">

<style>
/* Nur Kunden-App: Rahmen ohne claude.ai (dort setzt die Plattform diese Grundwerte) */
html, body { margin: 0; padding: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.kopf .rechts { max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.willkommen { justify-items: center; text-align: center; padding: 28px 18px; }
.willkommen .logo { width: 72px; height: 72px; border-radius: 18px; }
/* Code-Eingabe und Analyse (seit 29.10.2026) */
.code-feld { width: 100%; max-width: 280px; font-size: 30px; text-align: center; letter-spacing: .14em; font-variant-numeric: tabular-nums; }
.willkommen .einfuegen, .willkommen .einfuegen textarea { width: 100%; }
.analyse .frage { grid-template-columns: 1fr; gap: 8px; }
.analyse .janein span { min-width: 84px; padding: 10px 0; }
.analyse .frage-gross { font-size: 24px; line-height: 1.2; margin-bottom: 4px; }
.analyse .versteckt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Über mich, Rechtliches und Umzug (06.11.2026) */
.st-block.st-ueber { padding-bottom: 48px; }
.st-ueber-text { display: grid; justify-items: center; gap: 16px; max-width: 560px; }
.st-ueber-text .logo { width: 64px; height: 64px; border-radius: 16px; }
.st-ueber-text p { margin: 0; font-size: 17px; line-height: 1.47; color: var(--zeile); text-wrap: pretty; }
.st-fuss a { display: inline-block; padding: 8px 2px; color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.umzug .knopf { justify-self: start; }
body.start .umzug { grid-column: 1 / -1; margin: 12px 12px 0; }
/* Wie eine App (07.11.2026, Devin: „dass du nichts markieren kannst“, „dass man nicht reinzoomen kann“): kein Markieren außer in Feldern, kein Doppeltipp-Zoom */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* Größere Trefferfläche: In der Kunden-App stehen Knöpfe mindestens 12 px auseinander, darum 6 px Rand statt 4 (auf der Trainer-Seite nur 8 px Lücke) */
html :where(button, a[href], [role=button], label, summary):where(.knopf, .eb-knopf)::before { inset: -6px; }
/* Code-Leiste oben auf der Startseite (07.11.2026, Devin: „eine Leiste, wo du deinen Code direkt eingeben kannst … als Erstes gezeigt“) */
.code-leiste { display: grid; gap: 6px; }
body.start .code-leiste { grid-column: 1 / -1; margin: 12px 12px 0; }   /* wie die Karte „Neue Adresse“: Abstand zum Rand, auf dem PC über beide Spalten */
.code-leiste .lbl { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.code-leiste .leise { margin: 0; }
.code-reihe { display: flex; gap: 12px; align-items: stretch; margin-top: 4px; }
.code-reihe .code-feld { flex: 1 1 auto; min-width: 0; font-size: 20px; letter-spacing: .08em; text-align: center; font-variant-numeric: tabular-nums; }
.code-reihe .knopf { flex: none; }
.code-leiste [role="status"]:empty { display: none; }
/* PC und MacBook (07.11.2026, Devin: „auf dem PC … schön aussieht … Schrift schöner … schöne Effekte“): ab 1024 px ein ruhiger Rahmen bis 1280 px,
   große Überschriften mit enger Laufweite, größere Zeilen, Code-Leiste mittig. Effekte: Karten heben sich unter der Maus, die große Überschrift glänzt sanft. */
@media (min-width: 1024px) {
  body.start .inhalt { max-width: 1280px; margin-inline: auto; gap: 20px; padding-inline: 24px; }
  body.start .kopf-innen { max-width: 1280px; }
  body.start .code-leiste { justify-self: center; width: min(640px, 100%); margin: 24px 0 4px; padding: 22px 26px; }
  .code-leiste .lbl { font-size: 22px; }
  .st-block { border-radius: 32px; padding-block-start: 80px; gap: 36px; }
  .st-block.st-held { padding-top: 96px; border-radius: 36px; }
  .st-text { max-width: 780px; gap: 12px; }
  .st-block h1 { font-size: clamp(64px, 6.2vw, 96px); line-height: 1.02; letter-spacing: -.035em; font-weight: 700; }
  .st-block h2 { font-size: clamp(44px, 3.8vw, 60px); line-height: 1.05; letter-spacing: -.028em; font-weight: 700; }
  .st-zeile { font-size: 24px; line-height: 1.35; letter-spacing: -.005em; }
  .st-knoepfe { gap: 16px; margin-top: 22px; }
  .st-knoepfe .knopf { min-height: 52px; padding-inline: 26px; font-size: 18px; }
  .st-bild { max-width: 960px; }
  .st-mock, .st-fragen, .st-eigen .einfuegen { max-width: 480px; }
  .st-block:not(.st-held) { transition: transform .5s var(--feder), box-shadow .5s var(--sanft); }
  .st-block:not(.st-held):hover { transform: translateY(-6px); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .45); }
  .st-held h1 { background: linear-gradient(100deg, var(--held-text) 25%, var(--akzent-hell) 50%, var(--held-text) 75%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: st-glanz 8s ease-in-out infinite; }
  @keyframes st-glanz { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
}
@media (min-width: 1024px) and (prefers-reduced-motion: reduce) { .st-held h1 { animation: none; } .st-block:not(.st-held):hover { transform: none; } }
/* Wellen im Hintergrund und Schrift (09.11.2026, Devin: „Wellen … Strand“, Schrift „nicht so eckig, nicht so pixelig, schön sauber, ein bisschen größer“) */
.dk-wellen-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh; object-fit: cover; z-index: -1; pointer-events: none; }
.dk-wellen-video::-webkit-media-controls, .dk-wellen-video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
html.dk-wellen-an::before, html.dk-wellen-an::after { content: none; }
html:root { --f-text: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif; --f-display: var(--f-text); --f-zahl: var(--f-text); }
body { font-size: 18px; letter-spacing: 0; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.klein { font-size: 15px; }
.knopf { font-size: 17px; letter-spacing: 0; }
.knopf.klein { font-size: 15px; }
nav.leiste button { font-size: 13px; letter-spacing: 0; }
@media (min-width: 1024px) { .st-block h1 { letter-spacing: -.025em; } .st-block h2 { letter-spacing: -.02em; } }
</style>
