<!-- Devin Kanke Coach — Analyse für dich. Eigene Seite unter /analyse/, ohne Login, ohne Code, ohne Server.
     31.10.2026: 10 Fragen per WhatsApp (DK-Analyse10). Seit 06.11.2026 (Devin: „dass man zum Beispiel sein Gewicht und so alles … als erstes eingeben soll
     und dann fängt meine Analyse an … maximal 5, mach 5, 6 oder mach weniger“, „überall … einen Titel geben, was du gerade machst“, „bei Berufen … lass die Leute
     schreiben“, „mehrere Optionen auswählen … bis zu 4, 5 Sachen“, die Analyse soll „direkt geschickt“ werden): erst der Bogen „Über dich“ (höchstens 6 Felder),
     dann die 10 Fragen mit Titel oben (Ziele mehrfach, bis zu 5), dann der ganze Gesundheits-Check und die Einwilligung. Am Ende öffnet „An Devin senden“ die
     Mail-App, fertig ausgefüllt an Devin: lesbar plus Zeile DK-Analyse11:…:Ende für seine Seite. WhatsApp bleibt als zweiter Weg.
     Fragen, Bogen, Gruppen des Checks und Texte kommen aus der Wissensbasis (anamnese.json → kurzanalyse, sicherheit.json → screening), build.js setzt sie unten ein.
     Was eine Antwort bedeutet (Stopp, Anpassung), entscheidet allein die Trainer-Seite. -->

<style>
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
.inhalt { max-width: 560px; }
.kopf-innen { justify-content: space-between; }
.zu { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rand-weich); background: var(--flaeche); color: var(--text); font-size: 18px; cursor: pointer; }
.start { justify-items: center; text-align: center; padding: 28px 18px; }
.start .logo { width: 72px; height: 72px; border-radius: 18px; }
.still > * { animation: none !important; }
/* Fortschritt und Titel: was du gerade machst */
.an-fortschritt { height: 4px; border-radius: 999px; background: var(--linie); overflow: hidden; }
.an-fortschritt i { display: block; height: 100%; border-radius: inherit; background: var(--knopf-voll); transition: width .45s var(--feder); }
.titelzeile { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.016em; color: var(--akzent-hell); }
.frage-titel { font-family: var(--f-display); font-weight: 600; font-size: clamp(28px, 7.4vw, 32px); line-height: 1.13; letter-spacing: .004em; color: var(--text); margin: 0; }
.frage-titel:focus { outline: none; }
.block > .leise { margin: 0; }
/* Bogen „Über dich“ */
.drei { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.drei .mit-einheit { gap: 6px; }
.drei .eingabe { padding-inline: 10px; min-width: 0; }
.eingabe[aria-invalid="true"] { border-color: var(--stopp); }
.feld > label .frei, .feld > .lbl .frei { font-weight: 400; color: var(--text2); }
/* Fragen */
.eigene textarea { min-height: 72px; }
.feld.gross textarea { min-height: 150px; font-size: 17px; }   /* Fragen zum Schreiben: das Feld ist die Antwort */
.eigene > label { color: var(--akzent-hell); }
.ziele .rang { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin: 0 7px 0 -4px; border: 1.5px solid currentColor; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; }
/* Gesundheits-Check */
.check { display: grid; gap: 4px; }
.cfrage { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--linie); }
.cfrage:first-child { border-top: 0; padding-top: 4px; }
.cfrage p { margin: 0; font-size: 17px; line-height: 1.4; color: var(--text); }
.cfrage.folge { margin-left: 4px; padding-left: 14px; border-top: 0; box-shadow: inset 2px 0 0 var(--linie); }
.cfrage .janein { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cfrage .janein label { display: block; min-width: 0; }
.cfrage .janein span { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 44px; padding: 8px 6px; font-size: 15px; box-sizing: border-box; }
/* Gewählte Antwort satt gefüllt: Die getönte Fassung aus stil.css liegt in „Klar“ knapp unter 4,5:1. Schrift in Kartenfarbe passt in allen drei Farbwelten (über 5:1). */
.cfrage .janein input:checked + span.nein { background: var(--gut); border-color: var(--gut); color: var(--flaeche); }
.cfrage .janein input:checked + span.ja { background: var(--stopp); border-color: var(--stopp); color: var(--flaeche); }
.cfrage.an-offen .janein span { border-color: var(--stopp); }
.cfrage.an-offen p::after { content: " Bitte antworten."; color: var(--stopp); font-size: 14px; font-weight: 600; }
/* Kurz-Check (23.11.2026): Hauptfrage mit kurzem Titel und Beispielen, die genauen Fragen eingerückt darunter (erst nach Ja oder Weiß nicht) */
.kc { border-top: 1px solid var(--linie); }
.kc:first-child { border-top: 0; }
.kc > .cfrage { border-top: 0; }
.kc-titel { font-size: 15px; font-weight: 700; color: var(--text2); }
.cfrage p.kc-bsp { font-size: 15px; line-height: 1.4; color: var(--text2); }
.cfrage.an-offen p.kc-bsp::after { content: none; }
.kc-unter { display: grid; margin: 0 0 12px 4px; padding: 0 0 0 14px; box-shadow: inset 2px 0 0 var(--linie); }
.kc-unter .cfrage { padding: 12px 0; }
p.kc-hinweis { margin: 4px 0 0; font-size: 15px; font-weight: 600; color: var(--text2); }
.kc.an-offen { box-shadow: inset 3px 0 0 var(--stopp); padding-left: 12px; }
/* Ernährungs-Check (23.11.2026): erste Schritte und Hand-Portionen auf „Deine Nährwerte“ */
.nw-teil { display: grid; gap: 8px; margin-top: 18px; }
h2.nw-titel { margin: 0; font-size: 19px; }
.nw-schritte { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.nw-schritte li { font-size: 16px; line-height: 1.45; color: var(--text); }
/* 22.11.2026: „Schritt 7 von 18“ neben dem Titel, E-Mail vor dem Senden mit Tippfehler-Vorschlag, Fehlermeldung mit Ersatzwegen */
.an-kopfzeile { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.an-schritt { font-size: 13px; color: var(--text2); white-space: nowrap; }
.an-mail { margin: 16px 0 12px; }
.an-vorschlag { margin: -2px 0 0; font-size: 15px; line-height: 1.5; color: var(--text); }
.an-vorschlag[hidden] { display: none; }
.an-vorschlag .knopf { margin-left: 6px; }
.an-fehler { display: grid; gap: 12px; }
.an-fehler p { margin: 0; }
.an-fehler .reihe { display: flex; flex-wrap: wrap; gap: 12px; }
/* Fußleiste der Senden-Seite (zwei Reihen): Neben-Knöpfe auf Karten-Grund wie in der normalen Fußleiste (stil.css: .inhalt > .reihe .knopf), sonst in Lagune nur 4,15 : 1 */
.fuss.stapel .knopf:not(.haupt):not(.text) { background: var(--karte); }
/* 23.11.2026 (100-Kunden-Test): Handy quer – Fußleiste nicht festkleben, sonst verdeckt sie die Felder; Fehler im Bogen gesammelt über den Knöpfen */
@media (orientation: landscape) and (max-height: 500px) { .inhalt .fuss { position: static; } }   /* .inhalt davor: die Grundregel .fuss { position: sticky } steht weiter unten */
.an-bogen-fehler { display: grid; gap: 4px; }
.an-bogen-fehler p { margin: 0; }
/* Einwilligung */
.an-haken { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--linie); border-radius: var(--r-feld); background: var(--feld); cursor: pointer; }
.an-haken input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--akzent); }
.an-haken span { color: var(--text); font-size: 17px; line-height: 1.4; }
.an-haken.an-offen { border-color: var(--stopp); }
/* Übersicht vor dem Senden */
.zusammen { display: grid; gap: 18px; }
.zusammen section { display: grid; gap: 6px; }
.zusammen .kopfzeile { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.zusammen h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.016em; color: var(--akzent-hell); }
.zusammen .zeile { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
.zusammen .zeile:last-child { border-bottom: 0; }
.zusammen .zeile.paar { grid-template-columns: minmax(96px, auto) minmax(0, 1fr); column-gap: 12px; align-items: baseline; }
.fuss.stapel > .reihe { width: 100%; }
.zusammen .zeile b { font-size: 14px; font-weight: 600; color: var(--text2); }
.zusammen .zeile span { color: var(--text); overflow-wrap: anywhere; white-space: pre-line; }
/* Deine Nährwerte (07.11.2026): je Wert eine Karte, die Zahl groß */
.nw-liste { display: grid; gap: 10px; }
.nw-wert { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: baseline; padding: 14px 16px; border-radius: var(--r-feld); background: var(--feld); border: 1px solid var(--linie); }
.nw-wert .nw-name { font-size: 17px; color: var(--text); }
.nw-wert b { font-size: 21px; font-weight: 600; color: var(--text); white-space: nowrap; }
.nw-wert small { grid-column: 1 / -1; font-size: 14px; line-height: 1.4; color: var(--text2); }
.nw-hinweise { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; color: var(--text); }
.nw-rechtlich { margin: 0; padding-top: 12px; border-top: 1px solid var(--linie); }
.fuss { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--seite) 88%, transparent) 30%); }
/* Abschicken (Nachbesserung 14.11.2026): zwei Reihen statt drei, oben „Zurück“ + „An Devin senden“, darunter WhatsApp und Kopieren.
   12 px Abstand wie sonst in der Kunden-App, damit sich die 6-px-Ränder der Knöpfe nicht treffen */
.fuss.stapel { gap: 12px; }
.fuss.stapel > .reihe { flex-wrap: nowrap; gap: 12px; }
.fuss.stapel .knopf:not(.text) { padding-inline: 16px; }   /* bei 320 px passt „An Devin senden“ so in eine Zeile */
.fuss.stapel .knopf.haupt { flex: 1 1 auto; min-width: 0; box-sizing: border-box; }
.fuss.stapel .ersatz { justify-content: flex-end; }
.rechtliches { display: flex; justify-content: center; gap: 18px; font-size: 14px; }
.rechtliches a { color: var(--auf-grund2); display: inline-block; padding: 12px 2px; }   /* Gesamttest 13.11.2026: Trefferfläche 44 px hoch (vorher 21) */
.rechtliches { flex-wrap: wrap; }
.abo-preis { margin: 0; font-size: 17px; line-height: 1.4; }
.abo-preis b { font-size: 24px; }
.einwilligung-mehr a { color: var(--akzent-hell); }
/* Wie eine App (07.11.2026): kein Markieren außer in Feldern, kein Doppeltipp-Zoom */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* Größere Trefferfläche: In der Kunden-App stehen Knöpfe mindestens 12 px auseinander, darum 6 px Rand statt 4 (auf der Trainer-Seite nur 8 px Lücke) */
html :where(button, a[href], [role=button], label, summary):where(.knopf, .eb-knopf)::before { inset: -6px; }
/* Wellen im Hintergrund und Schrift (09.11.2026, Devin: „Wellen … Strand“, Schrift „nicht so eckig, nicht so pixelig, schön sauber, ein bisschen größer“) */
.dk-wellen-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh; object-fit: cover; z-index: -1; pointer-events: none; }
.dk-wellen-video::-webkit-media-controls, .dk-wellen-video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }
html.dk-wellen-an::before, html.dk-wellen-an::after { content: none; }
html:root { --f-text: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif; --f-display: var(--f-text); --f-zahl: var(--f-text); }
body { font-size: 18px; letter-spacing: 0; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.klein { font-size: 15px; }
.knopf { font-size: 17px; letter-spacing: 0; }
.knopf.klein { font-size: 15px; }
nav.leiste button { font-size: 13px; letter-spacing: 0; }
</style>

eren mit wenig Muskeln zu niedrig. Immer zusammen mit Taille-Größe-Verhältnis ansehen."},{"id":"taille_groesse_verhaeltnis","name":"Taille-Größe-Verhältnis (WHtR)","hinweis":"Faustregel: Taille kleiner als die halbe Körpergröße. Sagt Herz-Kreislauf- und Diabetes-Risiko besser voraus als BMI und Taille allein. Taille in der Mitte zwischen unterster Rippe und Beckenkamm messen, nach normalem Ausatmen."},{"id":"koerperfett_navy","name":"Körperfett-Schätzung (US-Navy-Umfangsmethode)","hinweis":"Metrische Fassung der Navy-Formel. Fehler gegenüber Labormethoden einige Prozentpunkte; für Verlauf (gleiche Person, gleiche Messstelle) besser als für Einzelwert. Männer: Taille auf Nabelhöhe. Frauen: Taille an der schmalsten Stelle plus Hüfte. Ergebnis unter 3 % oder über 60 %: Messfehler, nicht anzeigen."},{"id":"einrm_epley","name":"1RM-Schätzung (Epley)","hinweis":"Liefert bei wenigen Wdh etwas höhere Werte als Brzycki; bei genau 10 Wdh sind beide gleich. Über 10 Wdh nicht rechnen."},{"id":"einrm_brzycki","name":"1RM-Schätzung (Brzycki)","hinweis":"Standardformel der Plattform. Je weniger Wdh (ideal 3-6), desto genauer. Bei Sätzen mit Reserve: wdh = gemachte Wdh + RIR."},{"id":"einrm_lombardi","name":"1RM-Schätzung (Lombardi)","hinweis":"Nur zum Vergleich. Schätzt bei 5 Wdh am höchsten von den drei Formeln."},{"id":"hfmax_tanaka","name":"Maximale Herzfrequenz (Tanaka)","hinweis":"Standardformel der Plattform. Gilt für Männer und Frauen und unabhängig vom Trainingszustand. Einzelne Menschen liegen trotzdem oft 10 Schläge oder mehr daneben. Nicht bei Betablockern verwenden."},{"id":"hfmax_fox","name":"Maximale Herzfrequenz (220 minus Alter)","hinweis":"Bekannteste Faustformel, aber ohne saubere Datengrundlage. Unter etwa 40 Jahren zu hoch, darüber zu niedrig. Bei Kindern und Jugendlichen im Schnitt rund 12 Schläge zu hoch."},{"id":"hfmax_gellish","name":"Maximale Herzfrequenz (Gellish)","hinweis":"Längsschnittdaten, praktisch gleich wie Tanaka. Nur zum Vergleich."},{"id":"karv   var ANBIETER = ['gmail.com', 'googlemail.com', 'gmx.de', 'gmx.net', 'gmx.at', 'gmx.ch', 'gmx.com', 'web.de', 't-online.de', 'icloud.com', 'me.com', 'mac.com', 'outlook.com', 'outlook.de',
    'hotmail.com', 'hotmail.de', 'live.com', 'live.de', 'msn.com', 'yahoo.com', 'yahoo.de', 'yahoo.fr', 'aol.com', 'aol.de', 'freenet.de', 'posteo.de', 'mail.de', 'mail.com', 'email.de', 'online.de',
    'arcor.de', 'proton.me', 'protonmail.com'];
  function abstand(a, b) {   // Tippfehler-Abstand (Levenshtein)
    var v = [], i, j, vor, t;
    for (j = 0; j <= b.length; j++) v[j] = j;
    for (i = 1; i <= a.length; i++) { vor = v[0]; v[0] = i; for (j = 1; j <= b.length; j++) { t = v[j]; v[j] = Math.min(v[j] + 1, v[j - 1] + 1, vor + (a[i - 1] === b[j - 1] ? 0 : 1)); vor = t; } }
    return v[b.length];
  }
  function mailVorschlag(m) {   // „gmial.com“ → „gmail.com“: nur ein Vorschlag, geändert wird erst nach einem Tipp
    var t = String(m || '').trim().toLowerCase(), at = t.lastIndexOf('@'), d = at > 0 ? t.slice(at + 1) : '', best = '', bestA = 9;
    if (!d || ANBIETER.indexOf(d) >= 0) return '';
    ANBIETER.forEach(function (x) { var a = abstand(d, x); if (a < bestA) { bestA = a; best = x; } });
    return best && bestA <= (d.length >= 8 ? 2 : 1) ? t.slice(0, at + 1) + best : '';
  }
  function mailFehler() {
    var m = String(S.g.mail || '').trim(), m2 = String(S.mail2 || '').trim();
    if (!m) return 'Bitte trag deine E-Mail-Adresse ein.';
    if (m.length > 120 || !MAIL_RE.test(m)) return 'Bitte prüf deine E-Mail-Adresse.';
    if (m.toLowerCase() !== m2.toLowerCase()) return 'Die beiden E-Mail-Adressen sind nicht gleich.';
    return '';
  }
  function mailBlock() {
    var vorschlag = h('p', { class: 'an-vorschlag', role: 'status' });
    var m1 = h('input', { class: 'eingabe', id: 'e_mail', type: 'email', inputmode: 'email', autocomplete: 'email', autocapitalize: 'off', spellcheck: 'false', maxlength: 120, enterkeyhint: 'next', value: S.g.mail || '',
      oninput: function (e) { S.g.mail = e.target.value; e.target.removeAttribute('aria-invalid'); aendern(); zeige(); },
      onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); m2.focus(); } } });
    var m2 = h('input', { class: 'eingabe', id: 'e_mail2', type: 'email', inputmode: 'email', autocomplete: 'email', autocapitalize: 'off', spellcheck: 'false', maxlength: 120, enterkeyhint: 'done', value: S.mail2 || '',
      oninput: function (e) { S.mail2 = e.target.value; e.target.removeAttribute('aria-invalid'); speichern(); },
      onkeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } } });
    function zeige() {
      var v = mailVorschlag(S.g.mail);
      vorschlag.textContent = ''; vorschlag.hidden = !v;
      if (v) vorschlag.append('Meinst du ', h('b', { text: v }), '? ', h('button', { class: 'knopf text klein', type: 'button', text: 'Ja, ändern', onclick: function () { S.g.mail = v; m1.value = v; aendern(); zeige(); } }));
    }
    zeige();
    return h('div', { class: 'stapel an-mail' },
      h('div', { class: 'feld' }, h('label', { for: 'e_mail' }, 'Deine E-Mail-Adresse'), m1), vorschlag,
      h('div', { class: 'feld' }, h('label', { for: 'e_mail2' }, 'Nochmal zur Sicherheit'), m2),
      h('p', { class: 'leise klein', text: 'Dorthin schickt Devin deinen Zugang zur App.' }));
  }
  var sendetGerade = false;
  function absenden(knopf) {
    if (sendetGerade || !bereit()) return;
    var f = mailFehler();
    if (f) {
      toast(f);
      var feld = document.getElementById(MAIL_RE.test(String(S.g.mail || '').trim()) ? 'e_mail2' : 'e_mail');
      if (feld) { feld.setAttribute('aria-invalid', 'true'); feld.focus(); }
      return;
    }
    sendetGerade = true; knopf.disabled = true; knopf.textContent = 'Wird gesendet …';
    var stopp = typeof AbortController === 'function' ? new AbortController() : null, uhr = setTimeout(function () { if (stopp) stopp.abort(); }, 20000);
    var paket = { art: 'analyse', v: 1, betreff: betreff(), text: nachricht(), mail: String(S.g.mail).trim().toLowerCase() };
    var ende = function () { clearTimeout(uhr); sendetGerade = false; };
    fetch(ANALYSE_SKRIPT, { method: 'POST', body: JSON.stringify(paket), cache: 'no-store', credentials: 'omit', redirect: 'follow', signal: stopp ? stopp.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j || j.ok !== true) throw new Error(String((j && j.grund) || 'abgelehnt')); S.sendFehler = false; S.gesendet = true; S.weg = 'skript'; speichern(); })
      .then(function () { zeichne(); }, function () { S.sendFehler = true; zeichne(); toast('Das hat nicht geklappt. Bitte nochmal versuchen.'); })
      .then(ende, ende);
  }
  function fehlerBlock() {   // Senden ging nicht (kein Netz, Skript aus): nochmal oder Ersatzwege
    return h('div', { class: 'meldung an-fehler', role: 'alert' },
      h('p', { text: 'Das Senden hat nicht geklappt. Prüf dein Internet und tipp nochmal auf „Absenden“. Klappt es weiter nicht, schick deine Antworten mit deiner Mail-App oder per WhatsApp.' }),
      h('div', { class: 'reihe' }, mailKnopf('Mit Mail-App senden', 'knopf'), h('button', { class: 'knopf', type: 'button', onclick: whatsapp, text: 'Per WhatsApp' })));
  }
  // ---------- Ende Senden-Knopf ----------
  function sendenSeite(st, n, gesamt) {
    var c = checkAuswahl(), ja = c.ja.length + c.unsicher.length, skript = !!ANALYSE_SKRIPT;
    var los = skript ? h('button', { class: 'knopf haupt', type: 'button', text: 'Absenden' }) : mailKnopf('An Devin senden', 'knopf haupt');
    if (skript) los.addEventListener('click', function () { absenden(los); });
    return [h('section', { class: 'block' }, kopf(st, n, gesamt, 'Fertig! Stimmt alles?', skript ? 'Trag deine E-Mail-Adresse ein und tipp auf „Absenden“. Deine Antworten gehen dann direkt an Devin.' : 'Tipp auf „An Devin senden“: Deine Mail-App öffnet sich mit allem drin, du tippst dort nur noch auf Senden. Dein Zugang kommt per Mail an die Adresse, von der du sendest.'),
      ja ? h('p', { class: 'meldung klein', text: 'Du hast ' + ja + '× „Ja“ oder „Weiß nicht“ angetippt. Devin schaut sich das an und sagt dir, ob vorher etwas ärztlich abgeklärt werden sollte.' }) : null,
      unter18() ? h('p', { class: 'meldung klein', text: EW.eltern_hinweis }) : null,
      skript && S.sendFehler ? fehlerBlock() : null,
      skript ? mailBlock() : h('p', { class: 'leise klein', text: 'Lieber per WhatsApp? Dann schickt Devin dir den Zugang selbst.' }),
      zusammenfassung()),
      // Nachbesserung 14.11.2026: zwei Reihen statt drei (kleine Handys). Oben wie auf jeder Seite „Zurück“ und der Hauptknopf, darunter die Ersatzwege (nur ohne Senden-Knopf)
      h('div', { class: 'fuss stapel' },
        h('div', { class: 'reihe' },
          h('button', { class: 'knopf', type: 'button', onclick: function () { geh(n - 1); }, text: 'Zurück' }),
          los),
        skript ? null : h('div', { class: 'reihe ersatz' },
          h('button', { class: 'knopf', type: 'button', onclick: whatsapp, text: 'Per WhatsApp' }),
          h('button', { class: 'knopf text', type: 'button', onclick: kopieren, text: 'Kopieren' })))];
  }
  function danke() {
    var loeschen = h('button', { class: 'knopf text', type: 'button', text: 'Antworten auf diesem Handy löschen', onclick: function () {
      if (loeschen.dataset.sicher !== '1') { loeschen.dataset.sicher = '1'; loeschen.textContent = 'Wirklich löschen? Nochmal tippen'; return; }
      try { localStorage.removeItem(SPEICHER); } catch (e) {}
      S.g = {}; S.a = {}; S.s = {}; S.k = {}; S.e = {}; S.t = null; S.gesendet = false; S.gemahnt = {}; S.schritt = 0; S.weg = null; S.mail2 = ''; zeichne(); toast('Gelöscht.');
    } });
    // Ehrlich je Weg, ohne „Code“ (22.11.2026); Zeit: „innerhalb von 24 Stunden“ (Devin 23.11.2026). Jeder Plan läuft über Devin
    var weg = S.weg === 'skript' || S.weg === 'whatsapp' ? S.weg : 'mail', mail = String(S.g.mail || '').trim().toLowerCase(), mailOk = MAIL_RE.test(mail);
    var text = weg === 'skript' ? 'Deine Analyse ist bei Devin angekommen. Devin meldet sich innerhalb von 24 Stunden und schickt dir deinen Zugang an ' + mail + '. Schau auch im Spam nach.'
      : weg === 'whatsapp' ? 'Per WhatsApp geschickt? Dann meldet sich Devin innerhalb von 24 Stunden und schickt dir deinen Zugang selbst.'
      : 'Hat sich deine Mail-App geöffnet? Dann tipp dort noch auf Senden. Devin meldet sich innerhalb von 24 Stunden und schickt dir deinen Zugang per Mail an ' + (mailOk ? mail : 'die Adresse, von der du gesendet hast') + '. Schau auch im Spam nach.';
    var tage = ' Deine Antworten bleiben höchstens 30 Tage auf diesem Handy' + (weg === 'mail' ? ' (falls die Mail hängt)' : '') + ', dann löschen sie sich von selbst.';
    var zurUebersicht = function () { S.gesendet = false; geh(schritte().length); };
    return h('section', { class: 'block start' },
      h('img', { class: 'logo', src: '../icon.svg', alt: '' }),
      h('h1', { text: 'Danke!' }),
      h('p', { class: 'leise', text: text + tage }),
      weg === 'skript' ? h('button', { class: 'knopf text', type: 'button', onclick: zurUebersicht, text: 'Adresse falsch? Ändern' }) : mailKnopf(weg === 'whatsapp' ? 'Lieber per Mail schicken' : 'Mail nochmal öffnen', 'knopf haupt'),
      aboBlock(),
      ABO ? rechtliches() : null,
      weg === 'skript' ? null : h('button', { class: 'knopf', type: 'button', onclick: whatsapp, text: weg === 'whatsapp' ? 'Nochmal per WhatsApp schicken' : 'Lieber per WhatsApp schicken' }),
      // Hängt die Mail im Ausgang (Mail-App ohne funktionierendes Konto, 06.11.2026 bei Devins eigenem Test), hilft WhatsApp oder Kopieren in eine andere Mail-App
      weg === 'skript' ? null : h('p', { class: 'leise klein', text: 'Bleibt die Mail im Ausgang hängen, liegt es an der Mail-App. Dann kopier die Antworten und schick sie aus einer anderen Mail-App an ' + EMPFAENGER + '. Per WhatsApp geht es auch, dann schickt Devin dir den Zugang selbst.' }),
      weg === 'skript' ? null : h('button', { class: 'knopf text', type: 'button', onclick: kopieren, text: 'Antworten kopieren' }),
      NW ? h('button', { class: 'knopf', type: 'button', onclick: function () { var l = schritte(); for (var i = 0; i < l.length; i++) if (l[i].art === 'naehrwerte') { S.gesendet = false; geh(i + 1); return; } }, text: 'Deine Nährwerte ansehen' }) : null,
      h('button', { class: 'knopf text', type: 'button', onclick: zurUebersicht, text: weg === 'skript' ? 'Antworten ansehen' : 'Antworten ansehen oder ändern' }),
      loeschen);
  }
  // Ausstieg oben rechts: unterbrechen, die Antworten bleiben auf dem Handy
  function raus() {
    return h('section', { class: 'block start' },
      h('h1', { text: 'Später weitermachen?' }),
      h('p', { class: 'leise', text: 'Deine Antworten bleiben auf diesem Handy. Öffne einfach wieder den Link, dann geht es da weiter, wo du aufgehört hast.' }),
      h('button', { class: 'knopf haupt', type: 'button', onclick: function () { S.raus = false; zeichne(); }, text: 'Weiter ausfüllen' }),
      // 100-Kunden-Test (22.11.2026): „Zur Startseite“ führte auf die Einleitung der Analyse, jetzt auf die Startseite der Webseite
      h('button', { class: 'knopf text', type: 'button', onclick: function () { location.href = '../'; }, text: 'Zur Startseite' }));
  }
  zuKnopf.addEventListener('click', function () { S.raus = true; zeichne(); });

  // Handy-Zurück (22.11.2026, 100-Kunden-Test): Jeder Schritt steht in der Browser-Historie, Zurück geht einen Schritt zurück statt aus der Analyse heraus
  function verlauf(n, ersetzen) {
    try { var st = { dkAnalyse: n }; if (ersetzen) history.replaceState(st, ''); else if (!history.state || history.state.dkAnalyse !== n) history.pushState(st, ''); } catch (e) {}
  }
  function geh(n) { S.schritt = n; speichern(); verlauf(n); zeichne(); }
  window.addEventListener('popstate', function (e) {
    if (S.gesendet) { location.replace('../'); return; }   // nach dem Senden: Zurück verlässt die Analyse, die Antworten sind schon unterwegs
    S.raus = false; S.vonUebersicht = false; S.schritt = e.state && typeof e.state.dkAnalyse === 'number' ? e.state.dkAnalyse : 0; speichern(); zeichne();
  });
  verlauf(S.schritt, true);
  // still: gleicher Schritt neu zeichnen (z. B. Ort gewählt), ohne nach oben zu springen und ohne Einblenden
  function zeichne(still) {
    var y = window.scrollY;
    if (!still) { var altToast = document.querySelector('.toast'); if (altToast) altToast.remove(); }   // 100-Kunden-Test 23.11.2026: Hinweise blieben auf der nächsten Seite stehen und verdeckten Knöpfe
    inhalt.textContent = '';
    inhalt.classList.toggle('still', !!still);
    if (!FRAGEN.length || !BOGEN.felder.length || !KURZ.length) { inhalt.append(h('p', { class: 'meldung', text: 'Die Fragen fehlen. Bitte Devin Bescheid geben.' })); return; }
    var l = schritte(), gesamt = l.length;
    if (S.schritt > gesamt) S.schritt = gesamt;
    var zeige = S.zurStart ? 0 : S.schritt;
    S.zurStart = false;
    zuKnopf.hidden = zeige === 0 || S.raus || S.gesendet;
    var st = l[zeige - 1], teile;
    if (S.raus) teile = raus();
    else if (S.gesendet) teile = danke();
    else if (zeige === 0) teile = start();
    else if (st.art === 'bogen') teile = bogenSeite(st, zeige, gesamt);
    else if (st.art === 'frage') teile = frageSeite(st, zeige, gesamt);
    else if (st.art === 'check') teile = checkSeite(st, zeige, gesamt);
    else if (st.art === 'naehrwerte') teile = naehrwerteSeite(st, zeige, gesamt);
    else if (st.art === 'einwilligung') teile = einwilligungSeite(st, zeige, gesamt);
    else teile = sendenSeite(st, zeige, gesamt);
    [].concat(teile).forEach(function (t) { if (t) inhalt.append(t); });
    if (still) { window.scrollTo(0, y); return; }
    window.scrollTo(0, 0);
    var titel = document.getElementById('titel');
    if (titel) titel.focus({ preventScroll: true });
  }
  zeichne();
})();
</script>
