<!-- Devin Kanke Coach — Analyse für dich. Eigene Seite unter /analyse/, ohne Login, ohne Code, ohne Server.
     31.10.2026: 10 Fragen per WhatsApp (DK-Analyse10). Seit 06.11.2026 (Devin: „dass man zum Beispiel sein Gewicht und so alles … als erstes eingeben soll
     und dann fängt meine Analyse an … maximal 5, mach 5, 6 oder mach weniger“, „überall … einen Titel geben, was du gerade machst“, „bei Berufen … lass die Leute
     schreiben“, „mehrere Optionen auswählen … bis zu 4, 5 Sachen“, die Analyse soll „direkt geschickt“ werden): erst der Bogen „Über dich“ (höchstens 6 Felder),
     dann die 10 Fragen mit Titel oben (Ziele mehrfach, bis zu 5), dann der ganze Gesundheits-Check und die Einwilligung. Am Ende öffnet „An Devin senden“ die
     Mail-App, fertig ausgefüllt an Devin: lesbar plus Zeile DK-Analyse11:…:Ende für seine Seite. WhatsApp bleibt als zweiter Weg.
     Fragen, Bogen, Gruppen des Checks und Texte kommen aus der Wissensbasis (anamnese.json → kurzanalyse, sicherheit.json → screening), build.js setzt sie unten ein.
     Was eine Antwort bedeutet (Stopp, Anpassung), entscheidet allein die Trainer-Seite. -->

<style>
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
.inhalt { max-width: 560px; }
.kopf-innen { justify-content: space-between; }
.zu { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rand-weich); background: var(--flaeche); color: var(--text); font-size: 18px; cursor: pointer; }
.start { justify-items: center; text-align: center; padding: 28px 18px; }
.start .logo { width: 72px; height: 72px; border-radius: 18px; }
.still > * { animation: none !important; }
/* Fortschritt und Titel: was du gerade machst */
.an-fortschritt { height: 4px; border-radius: 999px; background: var(--linie); overflow: hidden; }
.an-fortschritt i { display: block; height: 100%; border-radius: inherit; background: var(--knopf-voll); transition: width .45s var(--feder); }
.titelzeile { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.016em; color: var(--akzent-hell); }
.frage-titel { font-family: var(--f-display); font-weight: 600; font-size: clamp(28px, 7.4vw, 32px); line-height: 1.13; letter-spacing: .004em; color: var(--text); margin: 0; }
.frage-titel:focus { outline: none; }
.block > .leise { margin: 0; }
/* Bogen „Über dich“ */
.drei { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.drei .mit-einheit { gap: 6px; }
.drei .eingabe { padding-inline: 10px; min-width: 0; }
.eingabe[aria-invalid="true"] { border-color: var(--stopp); }
.feld > label .frei, .feld > .lbl .frei { font-weight: 400; color: var(--text2); }
/* Fragen */
.eigene textarea { min-height: 72px; }
.feld.gross textarea { min-height: 150px; font-size: 17px; }   /* Fragen zum Schreiben: das Feld ist die Antwort */
.eigene > label { color: var(--akzent-hell); }
.ziele .rang { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin: 0 7px 0 -4px; border: 1.5px solid currentColor; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1; }
/* Gesundheits-Check */
.check { display: grid; gap: 4px; }
.cfrage { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--linie); }
.cfrage:first-child { border-top: 0; padding-top: 4px; }
.cfrage p { margin: 0; font-size: 17px; line-height: 1.4; color: var(--text); }
.cfrage.folge { margin-left: 4px; padding-left: 14px; border-top: 0; box-shadow: inset 2px 0 0 var(--linie); }
.cfrage .janein { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cfrage .janein label { display: block; min-width: 0; }
.cfrage .janein span { display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 44px; padding: 8px 6px; font-size: 15px; box-sizing: border-box; }
/* Gewählte Antwort satt gefüllt: Die getönte Fassung aus stil.css liegt in „Klar“ knapp unter 4,5:1. Schrift in Kartenfarbe passt in allen drei Farbwelten (über 5:1). */
.cfrage .janein input:checked + span.nein { background: var(--gut); border-color: var(--gut); color: var(--flaeche); }
.cfrage .janein input:checked + span.ja { background: var(--stopp); border-color: var(--stopp); color: var(--flaeche); }
.cfrage.an-offen .janein span { border-color: var(--stopp); }
.cfrage.an-offen p::after { content: " Bitte antworten."; color: var(--stopp); font-size: 14px; font-weight: 600; }
/* Einwilligung */
.an-haken { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--linie); border-radius: var(--r-feld); background: var(--feld); cursor: pointer; }
.an-haken input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--akzent); }
.an-haken span { color: var(--text); font-size: 17px; line-height: 1.4; }
.an-haken.an-offen { border-color: var(--stopp); }
/* Übersicht vor dem Senden */
.zusammen { display: grid; gap: 18px; }
.zusammen section { display: grid; gap: 6px; }
.zusammen .kopfzeile { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.zusammen h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.016em; color: var(--akzent-hell); }
.zusammen .zeile { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
.zusammen .zeile:last-child { border-bottom: 0; }
.zusammen .zeile.paar { grid-template-columns: minmax(96px, auto) minmax(0, 1fr); column-gap: 12px; align-items: baseline; }
.fuss.stapel > .reihe { width: 100%; }
.zusammen .zeile b { font-size: 14px; font-weight: 600; color: var(--text2); }
.zusammen .zeile span { color: var(--text); overflow-wrap: anywhere; white-space: pre-line; }
/* Deine Nährwerte (07.11.2026): je Wert eine Karte, die Zahl groß */
.nw-liste { display: grid; gap: 10px; }
.nw-wert { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: baseline; padding: 14px 16px; border-radius: var(--r-feld); background: var(--feld); border: 1px solid var(--linie); }
.nw-wert .nw-name { font-size: 17px; color: var(--text); }
.nw-wert b { font-size: 21px; font-weight: 600; color: var(--text); white-space: nowrap; }
.nw-wert small { grid-column: 1 / -1; font-size: 14px; line-height: 1.4; color: var(--text2); }
.nw-hinweise { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; line-height: 1.4; color: var(--text); }
.nw-rechtlich { margin: 0; padding-top: 12px; border-top: 1px solid var(--linie); }
.fuss { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--seite) 88%, transparent) 30%); }
.fuss.stapel .knopf.haupt { width: 100%; box-sizing: border-box; }
.rechtliches { display: flex; justify-content: center; gap: 18px; font-size: 14px; }
.rechtliches a { color: var(--auf-grund2); }
.einwilligung-mehr a { color: var(--akzent-hell); }
/* Wie eine App (07.11.2026): kein Markieren außer in Feldern, kein Doppeltipp-Zoom */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
/* Größere Trefferfläche: In der Kunden-App stehen Knöpfe mindestens 12 px auseinander, darum 6 px Rand statt 4 (auf der Trainer-Seite nur 8 px Lücke) */
html :where(button, a[href], [role=button], label, summary):where(.knopf, .eb-knopf)::before { inset: -6px; }
</style>

he_max","name":"Sinnvolle Abnahme pro Woche, obere Grenze (1 %)","hinweis":"Mehr als 1 % pro Woche über mehrere Wochen: Warnung ausgeben und Kalorien erhöhen."},{"id":"zunahme_kg_woche_max","name":"Sinnvolle Zunahme pro Woche, obere Grenze (0,5 %)","hinweis":"Untere Grenze 0,25 %. Fortgeschrittene eher am unteren Ende."},{"id":"wasser_gesamt","name":"Wasser gesamt pro Tag (DGE)","hinweis":"Gesamtwasser inklusive Wasser aus dem Essen. Getrunken werden davon gut die Hälfte (Erwachsene etwa 1,2-1,5 l). Bei Sport, Hitze, Fieber, viel Eiweiß oder Salz mehr. Nicht als reine Trinkmenge ausgeben."},{"id":"ballaststoffe","name":"Ballaststoffe pro Tag","hinweis":"DGE: mindestens 30 g, das sind etwa 14,6 g je 1000 kcal. Bei hohem Bedarf wird die Dichte hochgerechnet (Ableitung). Für Jugendliche gibt die DGE keinen Richtwert."},{"id":"bmi","name":"Body-Mass-Index","hinweis":"Unterscheidet nicht zwischen Muskeln und Fett. Bei muskulösen Menschen zu hoch, bei Älteren mit wenig Muskeln zu niedrig. Immer zusammen mit Taille-Größe-Verhältnis ansehen."},{"id":"taille_groesse_verhaeltnis","name":"Taille-Größe-Verhältnis (WHtR)","hinweis":"Faustregel: Taille kleiner als die halbe Körpergröße. Sagt Herz-Kreislauf- und Diabetes-Risiko besser voraus als BMI und Taille allein. Taille in der Mitte zwischen unterster Rippe und Beckenkamm messen, nach normalem Ausatmen."},{"id":"koerperfett_navy","name":"Körperfett-Schätzung (US-Navy-Umfangsmethode)","hinweis":"Metrische Fassung der Navy-Formel. Fehler gegenüber Labormethoden einige Prozentpunkte; für Verlauf (gleiche Person, gleiche Messstelle) besser als für Einzelwert. Männer: Taille auf Nabelhöhe. Frauen: Taille an der schmalsten Stelle plus Hüfte. Ergebnis unter 3 % oder über 60 %: Messfehler, nicht anzeigen."},{"id":"einrm_epley","name":"1RM-Schätzung (Epley)","hinweis":"Liefert bei wenigen Wdh etwas höhere Werte als Brzycki; bei genau 10 Wdh sind beide gleich. Über 10 Wdh nicht rechnen."},{"id":"einrm_brzycki","name":"1RM-Schätzung (Brzycki)","hinweis":"Standardformel der Plattform. Je weniger Wdh (ideal 3-6), desto genauer. Bei Sätzen mit Reserve: wdh = gemachte Wdh + RIR."},{"id":"einrm_lombardi","name":"1RM-Schätzung (Lombardi)","hinweis":"Nur zum Vergleich. Schätzt bei 5 Wdh am höchsten von den drei Formeln."},{"id":"hfmax_tanaka","name":"Maximale Herzfrequenz (Tanaka)","hinweis":"Standardformel der Plattform. Gilt für Männer und Frauen und unabhängig vom Trainingszustand. Einzelne Menschen liegen trotzdem oft 10 Schläge oder mehr daneben. Nicht bei Betablockern verwenden."},{"id":"hfmax_fox","name":"Maximale Herzfrequenz (220 minus Alter)","hinweis":"Bekannteste Faustformel, aber ohne saubere Datengrundlage. Unter etwa 40 Jahren zu hoch, darüber zu niedrig. Bei Kindern und Jugendlichen im Schnitt rund 12 Schläge zu hoch."},{"id":"hfmax_gellish","name":"Maximale Herzfrequenz (Gellish)","hinweis":"Längsschnittdaten, praktisch gleich wie Tanaka. Nur zum Vergleich."},{"id":"karvonen","name":"Zielpuls nach Karvonen (Herzfrequenzreserve)","hinweis":"intensitaet als Anteil der Herzfrequenzreserve von 0 bis 1 (0,7 = 70 %; Zonen in hf_zonen). Berücksichtigt den Ruhepuls und ist daher genauer als ein reiner Prozentwert der HFmax."}]}}};

    if (f.typ === 'zahl') return f.schnell ? nimm(f.schnell, v) + (f.einheit_text ? ' ' + f.einheit_text : '') : zahlText(v) + (f.einheit ? ' ' + f.einheit : '');
    return '„' + String(v).trim() + '“';
  }
  function bogenWert(f) { var v = S.g[f.id]; return leer(v) ? '' : f.typ === 'text' ? String(v).trim() : wert(f, v); }
  function zielZeilen() { return zieleListe().map(function (z, i) { return (i + 1) + '. ' + nimm((FELD.ziel || {}).optionen, z) + (i === 0 ? ' (Hauptziel)' : ''); }); }
  function antwortText(q) {
    return q.felder.filter(sichtbar).map(function (f) {
      if (q.mehrfach && f.id === q.frage_ist) return '';
      var w = wert(f, S.a[f.id]); return w ? (f.kurz && q.frage_ist !== f.id ? f.kurz + ': ' : '') + w : '';
    }).filter(Boolean).join(' · ');
  }
  function antworten() {
    var a = {};
    FRAGEN.forEach(function (q) {
      q.felder.forEach(function (f) {
        if (q.mehrfach && f.id === q.frage_ist) { var z = zieleListe().slice(0, q.mehrfach.max); if (z.length) a.ziele = z; return; }
        if (!leer(S.a[f.id]) && sichtbar(f)) a[f.id] = typeof S.a[f.id] === 'string' ? S.a[f.id].trim() : S.a[f.id];
        if (f.id === 'ausruestung' && S.a.ort === 'gym') a.ausruestung = gymGeraete(f);
      });
    });
    return a;
  }
  function daten() {
    var g = {}, s = {};
    BOGEN.felder.forEach(function (f) { var v = S.g[f.id]; if (!leer(v)) g[f.id] = typeof v === 'string' ? v.trim() : v; });
    aktiveCheckFragen().forEach(function (f) { if (S.s[f.id]) s[f.id] = S.s[f.id]; });   // nur, was für dich gilt: eine Folgefrage nach einem Nein geht nicht mit
    if (!S.t) { S.t = Date.now(); speichern(); }
    return { v: 11, t: S.t, g: g, a: antworten(), s: s, e: unter18() ? { einwilligung: true, eltern: true } : { einwilligung: true } };
  }
  function code() {
    var bytes = new TextEncoder().encode(JSON.stringify(daten())), s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return 'DK-Analyse11:' + btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') + ':Ende';
  }
  function checkAuswahl() {
    var akt = aktiveCheckFragen(), ja = akt.filter(function (f) { return S.s[f.id] === 'ja'; }), un = akt.filter(function (f) { return S.s[f.id] === 'unsicher'; });
    return { alle: akt, ja: ja, unsicher: un, nein: akt.length - ja.length - un.length };
  }
  function nachricht() {
    var z = [], c = checkAuswahl();
    z.push('Hi Devin, hier ist meine Analyse für ' + MARKE + '.', '');
    z.push('ÜBER MICH');
    BOGEN.felder.forEach(function (f) { var w = bogenWert(f); if (w) z.push((f.kurz || f.label) + ': ' + w); });
    z.push('', 'MEINE ZIELE');
    zielZeilen().forEach(function (x) { z.push(x); });
    FRAGEN.forEach(function (q) { if (q.mehrfach) q.felder.forEach(function (f) { if (f.id !== q.frage_ist && !leer(S.a[f.id])) z.push(f.label + ' ' + wert(f, S.a[f.id])); }); });
    z.push('', 'MEINE ANTWORTEN');
    FRAGEN.forEach(function (q) { if (!q.mehrfach) z.push(q.frage, antwortText(q) || '–', ''); });
    z.push('GESUNDHEITS-CHECK');
    c.ja.forEach(function (f) { z.push('Ja: ' + f.frage); });
    c.unsicher.forEach(function (f) { z.push('Weiß nicht: ' + f.frage); });
    z.push(c.ja.length || c.unsicher.length ? 'Nein bei allen anderen ' + c.nein + ' Fragen.' : 'Alle ' + c.nein + ' Fragen mit Nein beantwortet.');
    if (NW) { z.push('', 'MEINE NÄHRWERTE (so hat die Seite sie mir gezeigt)'); nwZeilen().forEach(function (x) { z.push(x[0] + ': ' + x[1]); }); }
    z.push('', 'EINWILLIGUNG', EW.text);
    if (unter18()) z.push(EW.eltern);
    z.push('', 'Code für deine Seite (nicht ändern):', code());
    return z.join('\n');
  }
  function betreff() { return 'Analyse für ' + MARKE + ': ' + String(S.g.name || '').trim(); }
  function mailLink() { return 'mailto:' + EMPFAENGER + '?subject=' + encodeURIComponent(betreff()) + '&body=' + encodeURIComponent(nachricht().replace(/\n/g, '\r\n')); }
  function bereit() {   // vor jedem Senden: fehlt noch etwas, dorthin springen
    var i = ersteLuecke();
    if (i < 0) return true;
    toast('Da fehlt noch etwas.'); geh(i + 1); return false;
  }
  function gesendet() { setTimeout(function () { S.gesendet = true; speichern(); zeichne(); }, 700); }
  function mailKnopf(text, klasse) {
    return h('a', { class: klasse, href: mailLink(), onclick: function (e) { if (!bereit()) { e.preventDefault(); return; } gesendet(); }, text: text });
  }
  function whatsapp() {
    if (!bereit()) return;
    var text = nachricht();
    if (navigator.share) { navigator.share({ text: text }).then(function () { S.gesendet = true; speichern(); zeichne(); }).catch(function () {}); return; }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    gesendet();
  }
  function kopieren() {
    if (!bereit()) return;
    var text = nachricht();
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Kopiert. Jetzt in eine Mail oder in WhatsApp an Devin einfügen.'); }, function () {
      var t = h('textarea', { class: 'eingabe', readonly: true, rows: '6', value: text, 'aria-label': 'Analyse zum Kopieren' }); inhalt.append(t); t.select(); toast('Markiert. Kopieren und an Devin schicken.');
    });
  }
  function zusammenfassung() {
    var l = schritte(), stelle = function (art, q) { for (var i = 0; i < l.length; i++) if (l[i].art === art && (!q || l[i].q === q)) return i + 1; return 1; };
    var teil = function (titel, nach, zeilen, paar, knopf) {   // knopf: anderer Text als „Ändern“ (Nährwerte rechnet die Seite, ändern geht über die Antworten)
      return h('section', null, h('div', { class: 'kopfzeile' }, h('h2', { text: titel }),
        h('button', { class: 'knopf text klein', type: 'button', 'aria-label': titel + ' ' + (knopf || 'Ändern').toLowerCase(), onclick: function () { S.vonUebersicht = true; geh(nach); }, text: knopf || 'Ändern' })),
        zeilen.map(function (z) { return h('div', { class: 'zeile' + (paar ? ' paar' : '') }, z[0] ? h('b', { text: z[0] }) : null, h('span', { text: z[1] })); }));
    };
    var c = checkAuswahl(), teile = [];
    teile.push(teil(BOGEN.titel || 'Über dich', stelle('bogen'), BOGEN.felder.filter(function (f) { return bogenWert(f); }).map(function (f) { return [f.kurz || f.label, bogenWert(f)]; }), true));
    FRAGEN.forEach(function (q) {
      if (q.mehrfach) {
        var extra = q.felder.filter(function (f) { return f.id !== q.frage_ist && !leer(S.a[f.id]); }).map(function (f) { return [f.label, wert(f, S.a[f.id])]; });
        teile.push(teil(q.titel || 'Deine Ziele', stelle('frage', q), [[null, zielZeilen().join('\n') || '–']].concat(extra)));
      } else teile.push(teil(q.titel || q.frage, stelle('frage', q), [[q.frage, antwortText(q) || '–']]));
    });
    var cz = c.ja.map(function (f) { return ['Ja', f.frage]; }).concat(c.unsicher.map(function (f) { return ['Weiß nicht', f.frage]; }));
    cz.push([null, cz.length ? 'Nein bei allen anderen ' + c.nein + ' Fragen.' : 'Alle ' + c.nein + ' Fragen mit Nein beantwortet.']);
    teile.push(teil(CHECK.titel || 'Gesundheits-Check', stelle('check'), cz));
    if (NW) teile.push(teil(NW.titel, stelle('naehrwerte'), nwZeilen(), true, 'Ansehen'));
    return h('div', { class: 'zusammen' }, teile);
  }
  function sendenSeite(st, n, gesamt) {
    var c = checkAuswahl(), ja = c.ja.length + c.unsicher.length;
    return [h('section', { class: 'block' }, kopf(st, n, gesamt, 'Fertig! Stimmt alles?', 'Tipp auf „An Devin senden“: Deine Mail-App öffnet sich mit allem drin, du tippst dort nur noch auf Senden.'),
      ja ? h('p', { class: 'meldung klein', text: 'Du hast ' + ja + '× „Ja“ oder „Weiß nicht“ angetippt. Devin schaut sich das an. Vielleicht brauchst du vor dem Training eine ärztliche Freigabe.' }) : null,
      unter18() ? h('p', { class: 'meldung klein', text: EW.eltern_hinweis }) : null,
      zusammenfassung()),
      h('div', { class: 'fuss stapel reihe' },
        mailKnopf('An Devin senden', 'knopf haupt'),
        h('div', { class: 'reihe' },
          h('button', { class: 'knopf', type: 'button', onclick: function () { geh(n - 1); }, text: 'Zurück' }),
          h('button', { class: 'knopf', type: 'button', style: 'margin-left:auto', onclick: whatsapp, text: 'Per WhatsApp' }),
          h('button', { class: 'knopf text', type: 'button', onclick: kopieren, text: 'Kopieren' })))];
  }
  function danke() {
    var loeschen = h('button', { class: 'knopf text', type: 'button', text: 'Antworten auf diesem Handy löschen', onclick: function () {
      if (loeschen.dataset.sicher !== '1') { loeschen.dataset.sicher = '1'; loeschen.textContent = 'Wirklich löschen? Nochmal tippen'; return; }
      try { localStorage.removeItem(SPEICHER); } catch (e) {}
      S.g = {}; S.a = {}; S.s = {}; S.e = {}; S.t = null; S.gesendet = false; S.gemahnt = {}; S.schritt = 0; zeichne(); toast('Gelöscht.');
    } });
    return h('section', { class: 'block start' },
      h('img', { class: 'logo', src: '../icon.svg', alt: '' }),
      h('h1', { text: 'Danke!' }),
      h('p', { class: 'leise', text: 'Hat sich deine Mail-App geöffnet? Dann tipp dort noch auf Senden. Devin schaut sich deine Antworten an und schickt dir deinen Link und deinen Code.' }),
      mailKnopf('Mail nochmal öffnen', 'knopf haupt'),
      h('button', { class: 'knopf', type: 'button', onclick: whatsapp, text: 'Lieber per WhatsApp schicken' }),
      // Hängt die Mail im Ausgang (Mail-App ohne funktionierendes Konto, 06.11.2026 bei Devins eigenem Test), hilft WhatsApp oder Kopieren in eine andere Mail-App
      h('p', { class: 'leise klein', text: 'Bleibt die Mail im Ausgang hängen, liegt es an der Mail-App. Schick die Antworten dann per WhatsApp, oder kopier sie und schick sie aus einer anderen Mail-App an ' + EMPFAENGER + '.' }),
      h('button', { class: 'knopf text', type: 'button', onclick: kopieren, text: 'Antworten kopieren' }),
      NW ? h('button', { class: 'knopf', type: 'button', onclick: function () { var l = schritte(); for (var i = 0; i < l.length; i++) if (l[i].art === 'naehrwerte') { S.gesendet = false; geh(i + 1); return; } }, text: 'Deine Nährwerte ansehen' }) : null,
      h('button', { class: 'knopf text', type: 'button', onclick: function () { S.gesendet = false; geh(schritte().length); }, text: 'Antworten ansehen oder ändern' }),
      loeschen);
  }
  // Ausstieg oben rechts: unterbrechen, die Antworten bleiben auf dem Handy
  function raus() {
    return h('section', { class: 'block start' },
      h('h1', { text: 'Später weitermachen?' }),
      h('p', { class: 'leise', text: 'Deine Antworten bleiben auf diesem Handy. Öffne einfach wieder den Link, dann geht es da weiter, wo du aufgehört hast.' }),
      h('button', { class: 'knopf haupt', type: 'button', onclick: function () { S.raus = false; zeichne(); }, text: 'Weiter ausfüllen' }),
      h('button', { class: 'knopf text', type: 'button', onclick: function () { S.raus = false; S.zurStart = true; zeichne(); }, text: 'Zur Startseite' }));
  }
  zuKnopf.addEventListener('click', function () { S.raus = true; zeichne(); });

  function geh(n) { S.schritt = n; speichern(); zeichne(); }
  // still: gleicher Schritt neu zeichnen (z. B. Ort gewählt), ohne nach oben zu springen und ohne Einblenden
  function zeichne(still) {
    var y = window.scrollY;
    inhalt.textContent = '';
    inhalt.classList.toggle('still', !!still);
    if (!FRAGEN.length || !BOGEN.felder.length || !CHECK.gruppen.length) { inhalt.append(h('p', { class: 'meldung', text: 'Die Fragen fehlen. Bitte Devin Bescheid geben.' })); return; }
    var l = schritte(), gesamt = l.length;
    if (S.schritt > gesamt) S.schritt = gesamt;
    var zeige = S.zurStart ? 0 : S.schritt;
    S.zurStart = false;
    zuKnopf.hidden = zeige === 0 || S.raus || S.gesendet;
    var st = l[zeige - 1], teile;
    if (S.raus) teile = raus();
    else if (S.gesendet) teile = danke();
    else if (zeige === 0) teile = start();
    else if (st.art === 'bogen') teile = bogenSeite(st, zeige, gesamt);
    else if (st.art === 'frage') teile = frageSeite(st, zeige, gesamt);
    else if (st.art === 'check') teile = checkSeite(st, zeige, gesamt);
    else if (st.art === 'naehrwerte') teile = naehrwerteSeite(st, zeige, gesamt);
    else if (st.art === 'einwilligung') teile = einwilligungSeite(st, zeige, gesamt);
    else teile = sendenSeite(st, zeige, gesamt);
    [].concat(teile).forEach(function (t) { if (t) inhalt.append(t); });
    if (still) { window.scrollTo(0, y); return; }
    window.scrollTo(0, 0);
    var titel = document.getElementById('titel');
    if (titel) titel.focus({ preventScroll: true });
  }
  zeichne();
})();
